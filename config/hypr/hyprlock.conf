# hyprlock — still HYPRLANG, not Lua. Hyprland 0.55 moved to Lua; the other
# hypr* tools did not. Do not convert this file.
#
# Colours come from matugen. That file is gitignored and will not exist until
# `install.sh --theme` has run, so the source is guarded by defaults below it —
# hyprlang has no conditional include, but a later assignment wins, so the
# generated file overrides these if present.

$surface   = rgba(1e1e2eff)
$onSurface = rgba(cdd6f4ff)
$onVar     = rgba(a6adc8ff)
$primary   = rgba(cba6f7ff)
$error     = rgba(f38ba8ff)

source = ./hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
    # Fractional scaling on the lock surface renders text blurry on some
    # drivers; 1 is correct here regardless of the monitor's scale.
    fractional_scaling = 2
}

background {
    monitor =
    # The wallpaper, blurred. hyprlock reads the file directly, so this must be
    # a real path: install.sh writes the current wallpaper to this location.
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    contrast = 1.0
    brightness = 0.6
    vibrancy = 0.15
}

# Clock. Big, and the only thing on screen until you type.
label {
    monitor =
    text = cmd[update:30000] date +"%H:%M"
    color = $onSurface
    font_size = 112
    font_family = Inter Light
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:3600000] date +"%A, %-d. %B"
    color = $onVar
    font_size = 18
    font_family = Inter
    position = 0, 90
    halign = center
    valign = center
}

# Password field.
input-field {
    monitor =
    size = 320, 48
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.3
    dots_center = true
    outer_color = $primary
    inner_color = $surface
    font_color = $onSurface
    fade_on_empty = false
    placeholder_text = <span foreground="##a6adc8">Password</span>
    fail_text = <span foreground="##f38ba8">$FAIL ($ATTEMPTS)</span>
    rounding = 14
    check_color = $primary
    fail_color = $error
    position = 0, -40
    halign = center
    valign = center
}

# Fingerprint. METAL ONLY, and support on the E16 Gen 3 is unverified — if
# fprintd is not enrolled this block is inert, it does not break the lock.
auth {
    fingerprint:enabled = true
    fingerprint:ready_message = Scan fingerprint or type password
    fingerprint:present_message = Scanning…
}

label {
    monitor =
    text = $LAYOUT
    color = $onVar
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -100
    halign = center
    valign = center
}
