# hypridle — HYPRLANG, not Lua.
#
# The ladder, per FEATURES.md: dim at 2min, screen off at 5, lock at 6,
# suspend at 15. Every step is suppressed while something holds an idle
# inhibitor (fullscreen video, a call).

general {
    lock_cmd = pidof hyprlock || hyprlock       # never stack two lock screens
    before_sleep_cmd = loginctl lock-session    # lock BEFORE suspending, not after
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    ignore_dbus_inhibit = false
}

# 2 min — dim the backlight. Cheap, reversible, and the warning that the rest
# of the ladder is coming.
listener {
    timeout = 120
    on-timeout = brightnessctl -s set 10
    on-resume  = brightnessctl -r
}

# 2 min — keyboard backlight off. METAL ONLY; harmless where the device is
# absent, brightnessctl just exits non-zero.
listener {
    timeout = 120
    on-timeout = brightnessctl -sd '*kbd_backlight' set 0
    on-resume  = brightnessctl -rd '*kbd_backlight'
}

# 5 min — screen off.
listener {
    timeout = 300
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 6 min — lock. After the screen is already off, so the lock surface appears
# behind a black screen rather than flashing up in front of you.
listener {
    timeout = 360
    on-timeout = loginctl lock-session
}

# 15 min — suspend.
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
