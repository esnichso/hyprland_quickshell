# hyprpaper — HYPRLANG, not Lua.
#
# Deliberately declares NO wallpaper. Pointing `path` at a directory makes
# hyprpaper cycle images on a timer (default 30s), and automatic wallpaper
# changes are not wanted.
#
# The shell's picker sets the wallpaper over IPC instead:
#
#   hyprctl hyprpaper wallpaper "eDP-1,/path/to/image.jpg,cover"
#
# and install.sh restores the last choice from
# ~/.local/state/quickshell/wallpaper at login. Never write the selection back
# into this file — it is a symlink into the repo and would leave the tree
# permanently dirty.
#
# Older examples mention `preload` and `unload`. Current versions take a path
# directly; run `hyprctl hyprpaper --help` to see what yours supports.

ipc = true
splash = false
