# kitty — appearance only. Add your own keybindings at the end; install.sh
# backs up whatever was here before symlinking.

font_family      JetBrainsMono Nerd Font
font_size        11.0
adjust_line_height 108%

# Translucency is kitty's OWN setting, not a Hyprland window rule. This is the
# distinction v1 got wrong: a window-rule opacity fades the TEXT along with the
# background. background_opacity fades only the background, so glyphs stay
# fully opaque over the blur, which is the only way it looks good.
background_opacity 0.88
background_blur 0

window_padding_width 8
hide_window_decorations yes
confirm_os_window_close 0

# Allow install.sh --theme to push a new palette to running instances.
allow_remote_control yes
listen_on unix:@mykitty

cursor_shape beam
cursor_blink_interval 0
scrollback_lines 10000
enable_audio_bell no

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted

# Generated by matugen. Missing until `install.sh --theme` has run; kitty
# tolerates a missing include, so a fresh clone still starts.
include colors.conf
