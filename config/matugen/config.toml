# matugen — the one place a colour is generated.
#
# Both theming modes render through these templates:
#   mode "wallpaper"  ->  matugen image <path>
#   mode "manual"     ->  matugen color hex <seed from themes/*.toml>
#
# There is exactly one code path from "a palette exists" to "everything is
# themed". Adding a themed target means adding a template here, never a second
# mechanism.
#
# Every output_path below is gitignored: config/ is symlinked into ~/.config,
# so generated files would otherwise leave the working tree permanently dirty.

[config]
# Wallpaper setting is NOT delegated to matugen. hyprpaper is driven from the
# shell's picker so the shell knows what the current wallpaper is; letting
# matugen also set it would give two writers and no single source of truth.
reload_apps = false

# --- if the ANSI colours still are not distinct enough --------------------
#
# Material 3 only has four hue families, so the kitty template's magenta and
# cyan are tonal variants rather than hues of their own. For six real hues,
# matugen can harmonise literal colours toward the wallpaper:
#
#   [config.custom_colors]
#   red     = { color = "#ff5555", blend = true }
#   green   = { color = "#50fa7b", blend = true }
#   yellow  = { color = "#f1fa8c", blend = true }
#   blue    = { color = "#6272ff", blend = true }
#   magenta = { color = "#ff79c6", blend = true }
#   cyan    = { color = "#8be9fd", blend = true }
#
# `blend = true` pulls each toward the wallpaper's hue, so they stay themed
# instead of being six fixed colours. They are then referenced from a template
# the same way a role is: {{colors.red.default.hex}}
#
# UNVERIFIED: the TOML shape is read from matugen's own OwnCustomColor type,
# but the template placeholder is not something this repo can test without a
# session. Check it landed before relying on it:
#
#   ./install/install.sh --theme && grep -E '^color(1|2|5) ' ~/.config/kitty/colors.conf
#
# If those lines are empty or still hold the template text, the placeholder is
# wrong — matugen names custom colours differently and the mapping needs a
# different prefix.

# --- the shell -------------------------------------------------------------
[templates.quickshell]
input_path = "~/.config/matugen/templates/colors.json"
output_path = "~/.config/quickshell/colors.json"

# --- terminal --------------------------------------------------------------
# kitty is included via `include colors.conf` in kitty.conf, and the palette is
# pushed to every RUNNING instance over its socket by install.sh --theme.
[templates.kitty]
input_path = "~/.config/matugen/templates/kitty-colors.conf"
output_path = "~/.config/kitty/colors.conf"

# --- compositor ------------------------------------------------------------
# Border gradient. conf/looks.lua requires this and falls back if absent.
[templates.hyprland]
input_path = "~/.config/matugen/templates/hypr-colors.lua"
output_path = "~/.config/hypr/conf/colors.lua"

# --- lock screen -----------------------------------------------------------
[templates.hyprlock]
input_path = "~/.config/matugen/templates/hyprlock-colors.conf"
output_path = "~/.config/hypr/hyprlock-colors.conf"

# --- GTK -------------------------------------------------------------------
# Imported by gtk.css in both GTK3 and GTK4. Applies on next app launch.
[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk-colors.css"
output_path = "~/.config/gtk-3.0/colors.css"

[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk-colors.css"
output_path = "~/.config/gtk-4.0/colors.css"

# --- login screen ----------------------------------------------------------
# SDDM runs as its own user and never sees $HOME, so this one renders to state
# and `install.sh --sddm` copies it into /usr/share as root. It is still a
# matugen template like every other target: --sddm moves a file, it does not
# generate a colour.
[templates.sddm]
input_path = "~/.config/matugen/templates/sddm-theme.conf"
output_path = "~/.local/state/quickshell/sddm-theme.conf"

# --- Qt --------------------------------------------------------------------
[templates.qt6ct]
input_path = "~/.config/matugen/templates/qt6ct-colors.conf"
output_path = "~/.config/qt6ct/colors/hypersetup.conf"
