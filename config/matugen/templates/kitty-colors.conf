# ANSI.
#
# Two rules this mapping got wrong before, both visible in a fastfetch palette:
#
# 1. NOTHING MAY REPEAT. Six of the sixteen used to be exact duplicates —
#    green and magenta were both `tertiary`, yellow and cyan were both
#    `secondary`, red and bright red were both `error`. Identical bytes cannot
#    be told apart no matter how the palette is generated.
#
# 2. A BRIGHT COLOUR IS NOT A CONTAINER ROLE. In a dark scheme `X_container` is
#    a DARK tone (~30) meant to sit *behind* text. Using it for the bright half
#    of each pair is why they read as muddy. The light counterpart is
#    `on_X_container` (~90), which is what belongs on top of a dark surface.
#
# Material 3 has FOUR hue families — primary, secondary, tertiary, error — and
# ANSI wants six. Red, green, yellow and blue get a family each, because those
# are the ones compiler output and `ls` actually use. Magenta and cyan are the
# `*_fixed` tones of tertiary and secondary: a different lightness of the same
# hue, distinct but not a hue of their own.
#
# For six genuinely different hues, see the custom-colour note in
# config/matugen/config.toml.
color0  {{colors.surface_container_highest.default.hex}}
color8  {{colors.outline.default.hex}}

color1  {{colors.error.default.hex}}
color9  {{colors.on_error_container.default.hex}}

color2  {{colors.tertiary.default.hex}}
color10 {{colors.on_tertiary_container.default.hex}}

color3  {{colors.secondary.default.hex}}
color11 {{colors.on_secondary_container.default.hex}}

color4  {{colors.primary.default.hex}}
color12 {{colors.on_primary_container.default.hex}}

color5  {{colors.tertiary_fixed_dim.default.hex}}
color13 {{colors.tertiary_fixed.default.hex}}

color6  {{colors.secondary_fixed_dim.default.hex}}
color14 {{colors.secondary_fixed.default.hex}}

color7  {{colors.on_surface_variant.default.hex}}
color15 {{colors.on_surface.default.hex}}
