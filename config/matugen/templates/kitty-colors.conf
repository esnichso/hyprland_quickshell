# Generated by matugen. Do not edit — overwritten on every theme apply.
# Included from kitty.conf. install.sh --theme also pushes this to every
# running kitty over its control socket, so open terminals recolour live.

background              {{colors.surface.default.hex}}
foreground              {{colors.on_surface.default.hex}}
cursor                  {{colors.primary.default.hex}}
cursor_text_color       {{colors.on_primary.default.hex}}

selection_background    {{colors.primary.default.hex}}
selection_foreground    {{colors.on_primary.default.hex}}

url_color               {{colors.tertiary.default.hex}}

active_border_color     {{colors.primary.default.hex}}
inactive_border_color   {{colors.outline.default.hex}}

active_tab_background   {{colors.primary.default.hex}}
active_tab_foreground   {{colors.on_primary.default.hex}}
inactive_tab_background {{colors.surface_container.default.hex}}
inactive_tab_foreground {{colors.on_surface_variant.default.hex}}

# ANSI. Material 3 has no notion of "the eight ANSI colours", so these are
# mapped from the tonal palettes: normal from the container tones, bright from
# the accent tones. The result tracks the wallpaper while staying legible,
# which matters because this is where you read compiler output.
color0  {{colors.surface_container_highest.default.hex}}
color8  {{colors.outline.default.hex}}
color1  {{colors.error.default.hex}}
color9  {{colors.error.default.hex}}
color2  {{colors.tertiary.default.hex}}
color10 {{colors.tertiary_container.default.hex}}
color3  {{colors.secondary.default.hex}}
color11 {{colors.secondary_container.default.hex}}
color4  {{colors.primary.default.hex}}
color12 {{colors.primary_container.default.hex}}
color5  {{colors.tertiary.default.hex}}
color13 {{colors.tertiary_container.default.hex}}
color6  {{colors.secondary.default.hex}}
color14 {{colors.secondary_container.default.hex}}
color7  {{colors.on_surface_variant.default.hex}}
color15 {{colors.on_surface.default.hex}}
