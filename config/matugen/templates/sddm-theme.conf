# The login screen's palette.
#
# SDDM exposes every key in [General] to the theme's QML as `config.<key>`, so
# this file is how the desktop's colours reach a greeter that cannot read
# $HOME. It renders to ~/.local/state, and `install.sh --sddm` copies it into
# /usr/share/sddm/themes/hypersetup/theme.conf as root — the copy is the only
# step that needs a password, and it generates no colour of its own.
#
# --sddm appends a `background=` line pointing at the wallpaper it copied in
# beside this file. [General] is the only section, so appending stays inside it.

[General]
colorBackground={{colors.background.default.hex}}
colorSurface={{colors.surface_container.default.hex}}
colorOnSurface={{colors.on_surface.default.hex}}
colorOnSurfaceVariant={{colors.on_surface_variant.default.hex}}
colorOutline={{colors.outline.default.hex}}
colorPrimary={{colors.primary.default.hex}}
colorOnPrimary={{colors.on_primary.default.hex}}
colorError={{colors.error.default.hex}}
fontFamily=Inter
